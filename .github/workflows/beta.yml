name: Beta Build

on:
  push:
    branches: ['main']

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build amd64
        run: gcc -shared -fPIC -O2 -o bds-ipv6fix_linux_amd64.so bds-ipv6fix.c -ldl

      - name: Build arm64
        run: aarch64-linux-gnu-gcc -shared -fPIC -O2 -o bds-ipv6fix_linux_arm64.so bds-ipv6fix.c -ldl

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_id }}-${{ github.sha }}
          name: Beta ${{ github.run_id }} (${{ github.sha }})
          prerelease: true
          body: |
            Automated beta build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Built: ${{ github.event.head_commit.timestamp }}
          files: |
            bds-ipv6fix_linux_amd64.so
            bds-ipv6fix_linux_arm64.so
