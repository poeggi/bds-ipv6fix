name: Beta Build

on:
  push:
    branches: ['main']
    paths: ['bds-ipv6fix.c']

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%d_%H-%M-%S)" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build amd64
        run: gcc -shared -fPIC -O2 -o bds-ipv6fix_linux_amd64.so bds-ipv6fix.c -ldl

      - name: Build arm64
        run: aarch64-linux-gnu-gcc -shared -fPIC -O2 -o bds-ipv6fix_linux_arm64.so bds-ipv6fix.c -ldl

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ steps.ts.outputs.value }}
          name: Beta ${{ steps.ts.outputs.value }}
          prerelease: true
          body: |
            Automated beta build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: |
            bds-ipv6fix_linux_amd64.so
            bds-ipv6fix_linux_arm64.so
