name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: Build amd64
        run: gcc -shared -fPIC -O2 -DBDS_IPV6FIX_VERSION='"${{ github.ref_name }}"' -o bds-ipv6fix_linux_x86_64.so bds-ipv6fix.c

      - name: Build arm64
        run: aarch64-linux-gnu-gcc -shared -fPIC -O2 -DBDS_IPV6FIX_VERSION='"${{ github.ref_name }}"' -o bds-ipv6fix_linux_aarch64.so bds-ipv6fix.c

      - name: Check required glibc symbol versions
        run: |
          for f in bds-ipv6fix_linux_x86_64.so bds-ipv6fix_linux_aarch64.so; do
            echo "== $f"
            readelf -V -W "$f" | grep -oE 'Name: GLIBC_[^ ]+' | sed 's/Name: //' | sort -uV > versions.txt
            cat versions.txt
            if [ ! -s versions.txt ]; then echo "no GLIBC version needs found in $f"; exit 1; fi
            if grep -vE '^GLIBC_2\.([0-9]|1[0-7])(\.[0-9]+)?$' versions.txt; then
              echo "$f requires a glibc symbol newer than GLIBC_2.17"; exit 1
            fi
          done

      - name: Test amd64
        run: |
          gcc -O2 -o test test.c
          SHIM=$PWD/bds-ipv6fix_linux_x86_64.so
          if ./test; then echo "test must fail without the shim"; exit 1; fi
          LD_PRELOAD=$SHIM ./test >out.log 2>&1 || { cat out.log; exit 1; }
          cat out.log
          grep -q "active on any port" out.log
          grep -q "Fixing IPv6: IPV6_V6ONLY=1" out.log
          SERVER_PORT_V6=19133 LD_PRELOAD=$SHIM ./test >out.log 2>&1 || { cat out.log; exit 1; }
          cat out.log
          grep -q "active on port 19133" out.log
          grep -q "Fixing IPv6: IPV6_V6ONLY=1" out.log
          if SERVER_PORT_V6=19132 LD_PRELOAD=$SHIM ./test; then echo "the shim must ignore other ports"; exit 1; fi
          for c in lone v6-holder v6only tcp; do
            ./test $c
            LD_PRELOAD=$SHIM ./test $c >out.log 2>&1 || { cat out.log; exit 1; }
            cat out.log
            grep -q "PASS" out.log
            if [ "$(grep -c "bds-ipv6fix" out.log)" != 1 ]; then echo "the shim must log only its startup line in case $c"; exit 1; fi
          done

      - name: Test arm64 (qemu)
        run: |
          aarch64-linux-gnu-gcc -O2 -o test-aarch64 test.c
          QEMU="qemu-aarch64 -L /usr/aarch64-linux-gnu"
          SHIM=$PWD/bds-ipv6fix_linux_aarch64.so
          if $QEMU ./test-aarch64; then echo "test must fail without the shim"; exit 1; fi
          $QEMU -E LD_PRELOAD=$SHIM ./test-aarch64 >out.log 2>&1 || { cat out.log; exit 1; }
          cat out.log
          grep -q "Fixing IPv6: IPV6_V6ONLY=1" out.log
          for c in lone v6-holder v6only tcp; do
            $QEMU -E LD_PRELOAD=$SHIM ./test-aarch64 $c >out.log 2>&1 || { cat out.log; exit 1; }
            cat out.log
            grep -q "PASS" out.log
            if [ "$(grep -c "bds-ipv6fix" out.log)" != 1 ]; then echo "the shim must log only its startup line in case $c"; exit 1; fi
          done

      - name: Test amd64 on Debian 12 (glibc 2.36) and on current Debian
        run: |
          for img in debian:12 debian; do
            docker run --rm --network host -v "$PWD:/w:ro" -w /tmp $img sh -ec '
              apt-get update -qq >/dev/null && apt-get install -y -qq gcc libc6-dev >/dev/null
              ldd --version | head -1
              SHIM=/w/bds-ipv6fix_linux_x86_64.so
              gcc -O2 -o test-old /w/test.c
              if ./test-old; then echo "test must fail without the shim"; exit 1; fi
              LD_PRELOAD=$SHIM ./test-old >out.log 2>&1 || { cat out.log; exit 1; }
              cat out.log
              grep -q "Fixing IPv6: IPV6_V6ONLY=1" out.log
              for c in lone v6-holder v6only tcp; do
                LD_PRELOAD=$SHIM ./test-old $c >out.log 2>&1 || { cat out.log; exit 1; }
                cat out.log
                if [ "$(grep -c "bds-ipv6fix" out.log)" != 1 ]; then echo "the shim must log only its startup line in case $c"; exit 1; fi
              done'
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Built from commit ${{ github.sha }}.

            See [bds-ipv6fix.c](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/bds-ipv6fix.c) for the full technical description.
          files: |
            bds-ipv6fix_linux_x86_64.so
            bds-ipv6fix_linux_aarch64.so
