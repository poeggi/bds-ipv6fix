name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build amd64
        run: gcc -shared -fPIC -O2 -o bds-ipv6fix_linux_amd64.so bds-ipv6fix.c -ldl

      - name: Build arm64
        run: aarch64-linux-gnu-gcc -shared -fPIC -O2 -o bds-ipv6fix_linux_arm64.so bds-ipv6fix.c -ldl

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Built from commit ${{ github.sha }}.

            See [bds-ipv6fix.c](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/bds-ipv6fix.c) for the full technical description.
          files: |
            bds-ipv6fix_linux_amd64.so
            bds-ipv6fix_linux_arm64.so
