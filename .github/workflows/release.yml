name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: Build amd64
        run: gcc -shared -fPIC -O2 -DBDS_IPV6FIX_VERSION='"${{ github.ref_name }}"' -o bds-ipv6fix_linux_x86_64.so bds-ipv6fix.c -ldl

      - name: Build arm64
        run: aarch64-linux-gnu-gcc -shared -fPIC -O2 -DBDS_IPV6FIX_VERSION='"${{ github.ref_name }}"' -o bds-ipv6fix_linux_aarch64.so bds-ipv6fix.c -ldl

      - name: Test amd64
        run: |
          gcc -O2 -o test test.c
          if ./test; then echo "test must fail without the shim"; exit 1; fi
          LD_PRELOAD=$PWD/bds-ipv6fix_linux_x86_64.so ./test >out.log 2>&1
          cat out.log
          grep -q "Fixing IPv6: IPV6_V6ONLY=1" out.log
          LD_PRELOAD=$PWD/bds-ipv6fix_linux_x86_64.so ./test native-fix >out.log 2>&1
          cat out.log
          grep -q "patch is now redundant" out.log

      - name: Test arm64 (qemu)
        run: |
          aarch64-linux-gnu-gcc -O2 -o test-aarch64 test.c
          if qemu-aarch64 -L /usr/aarch64-linux-gnu ./test-aarch64; then echo "test must fail without the shim"; exit 1; fi
          qemu-aarch64 -L /usr/aarch64-linux-gnu -E LD_PRELOAD=$PWD/bds-ipv6fix_linux_aarch64.so ./test-aarch64 >out.log 2>&1
          cat out.log
          grep -q "Fixing IPv6: IPV6_V6ONLY=1" out.log

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Built from commit ${{ github.sha }}.

            See [bds-ipv6fix.c](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/bds-ipv6fix.c) for the full technical description.
          files: |
            bds-ipv6fix_linux_x86_64.so
            bds-ipv6fix_linux_aarch64.so
